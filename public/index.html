<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="start.title">BabySauron</title>
    <meta name="description" content="Monitor inteligente de bebê em tempo real - BabySauron">
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#09090b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/svg+xml" href="/assets/babysauron-icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-canvas: #09090b;
            --bg-surface: rgba(18, 18, 20, 0.85);
            --bg-surface-elevated: rgba(28, 28, 32, 0.95);
            --bg-card: #121214;
            --bg-card-hover: #18181c;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(217, 119, 6, 0.45);
            --accent-amber: #d97706;
            --accent-amber-glow: rgba(217, 119, 6, 0.25);
            --accent-amber-subtle: rgba(217, 119, 6, 0.12);
            --status-green: #16a34a;
            --status-red: #dc2626;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(217, 119, 6, 0.06) 0%, transparent 60%);
        }

        .hub-container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Top Brand Navigation */
        .hub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .sauron-eye-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fbbf24 0%, #d97706 50%, #78350f 100%);
            position: relative;
            box-shadow: 0 0 20px var(--accent-amber-glow);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sauron-eye-pupil {
            width: 5px;
            height: 24px;
            background: #09090b;
            border-radius: 4px;
        }

        .brand-titles h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .brand-titles p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Language Switcher */
        .lang-switcher {
            display: inline-flex;
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2px;
            gap: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
            min-height: 32px;
        }

        .lang-btn.active {
            background: var(--accent-amber);
            color: #09090b;
        }

        .lang-btn:not(.active):hover {
            color: var(--text-primary);
        }

        /* Main Mode Selection Cards */
        .modes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (max-width: 640px) {
            .modes-grid {
                grid-template-columns: 1fr;
            }
        }

        .mode-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }

        .mode-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .mode-card:active {
            transform: translateY(0);
        }

        .mode-card-sender {
            border-color: rgba(217, 119, 6, 0.2);
        }

        .mode-card-sender:hover {
            border-color: var(--accent-amber);
        }

        .mode-card-receiver {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .mode-card-receiver:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .mode-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mode-badge-icon {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .mode-card-sender .mode-badge-icon {
            background: var(--accent-amber-subtle);
            border-color: rgba(217, 119, 6, 0.3);
        }

        .mode-arrow-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .mode-card:hover .mode-arrow-btn {
            background: var(--accent-amber);
            color: #09090b;
            transform: translateX(3px);
        }

        .mode-card-body h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .mode-card-body p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        /* Session Setup Panel */
        .session-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .session-field-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 520px) {
            .session-field-row {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .session-input-wrapper {
            flex: 1;
            position: relative;
        }

        .session-input-wrapper label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .session-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--bg-canvas);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-primary);
            min-height: 48px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .session-input:focus {
            outline: none;
            border-color: var(--accent-amber);
            box-shadow: 0 0 0 3px var(--accent-amber-subtle);
        }

        .session-input::placeholder {
            color: var(--text-muted);
        }

        /* Discrete Quick Settings Row */
        .quick-settings-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-pills-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .setting-label-mini {
            font-size: 0.725rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-right: 4px;
        }

        .segmented-pill {
            display: inline-flex;
            background: var(--bg-canvas);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
        }

        .segmented-pill button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            font-size: 0.725rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 28px;
        }

        .segmented-pill button.active {
            background: var(--accent-amber);
            color: #09090b;
        }

        .segmented-pill button:not(.active):hover {
            color: var(--text-primary);
        }

        /* Footer Status Pill */
        .hub-footer {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .status-dot.active {
            background: var(--status-green);
            box-shadow: 0 0 8px rgba(22, 163, 74, 0.6);
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <!-- Brand & Language Header -->
        <header class="hub-header">
            <div class="brand-group">
                <img src="/assets/babysauron-icon.svg" alt="BabySauron" width="44" height="44" style="border-radius: 12px; box-shadow: 0 0 20px var(--accent-amber-glow); flex-shrink: 0;">
                <div class="brand-titles">
                    <h1 data-i18n="app.title">BabySauron</h1>
                    <p data-i18n="app.subtitle">Monitor inteligente de áudio e vídeo em tempo real</p>
                </div>
            </div>

            <div id="langSwitcher" class="lang-switcher">
                <button type="button" class="lang-btn active" data-lang="pt-BR">BR</button>
                <button type="button" class="lang-btn" data-lang="en-US">EN</button>
            </div>
        </header>

        <!-- Mode Selection Action Cards -->
        <main class="modes-grid">
            <!-- Mode 1: Câmera do Bebê (Sender) -->
            <button class="mode-card mode-card-sender" id="senderBtn" type="button" aria-label="Transmitir Câmera do Bebê">
                <div class="mode-card-header">
                    <div class="mode-badge-icon">📹</div>
                    <div class="mode-arrow-btn">→</div>
                </div>
                <div class="mode-card-body">
                    <h2 class="role-title" data-i18n="start.sender_btn_title">Transmitir Câmera</h2>
                    <p class="role-sub" data-i18n="start.sender_btn_sub">Posicione este aparelho no quarto do bebê</p>
                </div>
            </button>

            <!-- Mode 2: Monitor dos Pais (Receiver) -->
            <button class="mode-card mode-card-receiver" id="receiverBtn" type="button" aria-label="Abrir Monitor dos Pais">
                <div class="mode-card-header">
                    <div class="mode-badge-icon">👶</div>
                    <div class="mode-arrow-btn">→</div>
                </div>
                <div class="mode-card-body">
                    <h2 class="role-title" data-i18n="start.receiver_btn_title">Monitor dos Pais</h2>
                    <p class="role-sub" data-i18n="start.receiver_btn_sub">Assista e escute o bebê ao vivo no tablet ou celular</p>
                </div>
            </button>
        </main>

        <!-- Session Configuration Panel -->
        <section class="session-panel">
            <div class="session-field-row">
                <div class="session-input-wrapper">
                    <label for="sessionInput" data-i18n="start.session_label">Nome da Sessão (Conexão)</label>
                    <input
                        type="text"
                        id="sessionInput"
                        class="session-input"
                        data-i18n-placeholder="start.session_placeholder"
                        placeholder="ex: quarto-bebe, berco-sala"
                        autocomplete="off"
                        autocapitalize="none"
                    >
                </div>
            </div>

            <!-- Discrete Quick Settings -->
            <div class="quick-settings-bar">
                <div class="settings-pills-group">
                    <span class="setting-label-mini" data-i18n="start.quality_label">Vídeo:</span>
                    <div class="segmented-pill">
                        <button type="button" class="quality-option" data-quality="sd" data-i18n="start.quality_sd">SD</button>
                        <button type="button" class="quality-option active" data-quality="hd" data-i18n="start.quality_hd">HD</button>
                    </div>
                </div>

                <div class="settings-pills-group">
                    <span class="setting-label-mini" data-i18n="start.mode_label">Modo:</span>
                    <div class="segmented-pill">
                        <button type="button" class="stream-option active" data-mode="av" data-i18n="start.mode_av">Vídeo + Áudio</button>
                        <button type="button" class="stream-option" data-mode="audio" data-i18n="start.mode_audio">Áudio</button>
                    </div>
                </div>

                <div class="settings-pills-group">
                    <span class="setting-label-mini" data-i18n="start.transport_label">Rota:</span>
                    <div class="segmented-pill">
                        <button type="button" class="transport-option active" data-transport="direct" data-i18n="start.transport_direct">Direto</button>
                        <button type="button" class="transport-option" data-transport="relay" data-i18n="start.transport_relay">Relay</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer Connection Status -->
        <footer class="hub-footer">
            <div class="status-pill" id="statusCard">
                <div class="status-dot" id="statusIndicator"></div>
                <span id="statusTitle" data-i18n="start.checking_status">Verificando status...</span>
                <span id="statusDetail" style="opacity: 0.65; margin-left: 4px;" data-i18n="start.connecting_server"></span>
            </div>
        </footer>
    </div>

    <script type="module">
        import { t, setLanguage, getLanguage, onLanguageChange } from '/js/i18n.js';

        const sessionInput = document.getElementById('sessionInput');
        const senderBtn = document.getElementById('senderBtn');
        const receiverBtn = document.getElementById('receiverBtn');
        const qualityOptions = document.querySelectorAll('.quality-option');
        const streamOptions = document.querySelectorAll('.stream-option');
        const transportOptions = document.querySelectorAll('.transport-option');
        const langButtons = document.querySelectorAll('.lang-btn');

        // Quality toggle
        let selectedQuality = 'hd';
        qualityOptions.forEach(option => {
            option.addEventListener('click', () => {
                qualityOptions.forEach(o => o.classList.remove('active'));
                option.classList.add('active');
                selectedQuality = option.dataset.quality;
            });
        });

        // Stream mode toggle
        let selectedMode = localStorage.getItem('babymonitor-stream-mode') || 'av';
        function setStreamMode(mode) {
            selectedMode = mode === 'audio' ? 'audio' : 'av';
            streamOptions.forEach(option => {
                option.classList.toggle('active', option.dataset.mode === selectedMode);
            });
            localStorage.setItem('babymonitor-stream-mode', selectedMode);
        }
        streamOptions.forEach(option => {
            option.addEventListener('click', () => setStreamMode(option.dataset.mode));
        });
        setStreamMode(selectedMode);

        // Transport toggle
        let selectedTransport = localStorage.getItem('babymonitor-transport-mode') === 'relay' ? 'relay' : 'direct';
        function setTransportMode(mode) {
            selectedTransport = mode === 'relay' ? 'relay' : 'direct';
            transportOptions.forEach(option => {
                option.classList.toggle('active', option.dataset.transport === selectedTransport);
            });
            localStorage.setItem('babymonitor-transport-mode', selectedTransport);
        }
        transportOptions.forEach(option => {
            option.addEventListener('click', () => setTransportMode(option.dataset.transport));
        });
        setTransportMode(selectedTransport);

        // Language switcher
        function updateLangButtons(lang) {
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }
        langButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetLang = btn.dataset.lang;
                setLanguage(targetLang);
                updateLangButtons(targetLang);
            });
        });
        updateLangButtons(getLanguage());

        // Pre-fill session from localStorage or default
        const savedSession = localStorage.getItem('babymonitor-session');
        if (savedSession) {
            sessionInput.value = savedSession;
        }

        function navigateToRole(role) {
            const session = sessionInput.value.trim();
            const pathMap = { sender: 's', receiver: 'r' };
            const shortPath = pathMap[role] || role;
            const queryParams = [];

            if (role === 'sender') {
                queryParams.push(`q=${selectedQuality}`);
            }
            if (role === 'sender' && selectedMode === 'audio') {
                queryParams.push('mode=audio');
            }
            if (role === 'sender' && selectedTransport === 'relay') {
                queryParams.push('transport=relay');
            }

            const queryString = queryParams.length > 0 ? `?${queryParams.join('&')}` : '';

            if (!session) {
                window.location.href = `/${role}${queryString}`;
            } else {
                localStorage.setItem('babymonitor-session', session);
                window.location.href = `/${shortPath}/${encodeURIComponent(session)}${queryString}`;
            }
        }

        senderBtn.addEventListener('click', () => navigateToRole('sender'));
        receiverBtn.addEventListener('click', () => navigateToRole('receiver'));

        sessionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                senderBtn.focus();
            }
        });

        async function checkStatus() {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusTitle = document.getElementById('statusTitle');
            const statusDetail = document.getElementById('statusDetail');

            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.activeSessions > 0) {
                    statusIndicator.classList.add('active');
                    statusTitle.textContent = `${data.activeSessions} ${t('start.sender_active')}`;
                    statusDetail.textContent = t('start.receivers_count', { count: data.totalReceivers });
                } else {
                    statusIndicator.classList.remove('active');
                    statusTitle.textContent = t('start.session_idle');
                    statusDetail.textContent = '';
                }
            } catch (err) {
                statusIndicator.classList.remove('active');
                statusTitle.textContent = t('start.connecting_server');
                statusDetail.textContent = '';
            }
        }

        onLanguageChange(() => {
            updateLangButtons(getLanguage());
            checkStatus();
        });

        checkStatus();
        setInterval(checkStatus, 5000);
    </script>
</body>
</html>
