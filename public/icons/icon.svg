<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer amber orbit rings -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="#d97706" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 8"/>
  <circle cx="256" cy="240" r="180" fill="none" stroke="#b45309" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Sauron Eye almond outline -->
  <path d="M 120 240 Q 256 120 392 240 Q 256 360 120 240 Z" fill="none" stroke="#d97706" stroke-width="4" stroke-opacity="0.35"/>
  
  <!-- Center Glowing Orb (Eye of Sauron Pupil & Lens) -->
  <circle cx="256" cy="240" r="88" fill="url(#glowGrad)" filter="url(#glow)"/>
  
  <!-- Vertical Cat/Sauron Slit Pupil softened with Baby Face arc -->
  <ellipse cx="256" cy="240" rx="18" ry="64" fill="#09090b"/>
  <circle cx="256" cy="232" r="8" fill="#fbbf24"/>
  
  <!-- Wireless signal waves at the top -->
  <path d="M 200 100 Q 256 70 312 100" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 224 125 Q 256 100 288 125" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  
  <!-- App Label Pill bottom -->
  <rect x="136" y="380" width="240" height="48" rx="24" fill="#121214" stroke="#d97706" stroke-width="2" stroke-opacity="0.4"/>
  <text x="256" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="2">SAURON BABY</text>
</svg>
